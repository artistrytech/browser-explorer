<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232f9e44'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='2.6'%20stroke-linecap='round'%3E%3Cpath%20d='M11%207V25'/%3E%3Cpath%20d='M11%2013C11%2019%2021%2015%2021%2020'/%3E%3C/g%3E%3Cg%20fill='%23fff'%3E%3Ccircle%20cx='11'%20cy='7'%20r='3.2'/%3E%3Ccircle%20cx='11'%20cy='25'%20r='3.2'/%3E%3Ccircle%20cx='21'%20cy='20'%20r='3.2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Explorer</title>
  </head>
  <body>
    <script>
      // 設定 (API) の読み込み前にライトテーマで描画されて白くちらつかないよう、
      // 最後に使ったテーマを CSS の適用前に付けておく (src/lib/themeCache.ts と同じキー)
      try {
        if (localStorage.getItem('app:theme') === 'dark') {
          document.body.dataset.theme = 'dark';
          // CSS が当たるまでの背景。アプリ内タブ (iframe) では透明のままにしてシェルの背景を見せる
          if (window.parent === window) document.documentElement.style.backgroundColor = '#1e1e1e';
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
